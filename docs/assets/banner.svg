<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Georgia,'Times New Roman',serif">
  <defs>
    <linearGradient id="gbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe1"/>
      <stop offset="1" stop-color="#eadfc8"/>
    </linearGradient>
    <clipPath id="gbFaceClip"><circle cx="0" cy="0" r="118"/></clipPath>
    <pattern id="gbBoard" x="-120" y="-120" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#b58863"/>
      <rect width="30" height="30" fill="#f0d9b5"/>
      <rect x="30" y="30" width="30" height="30" fill="#f0d9b5"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#gbBg)"/>
  <g opacity=".08" fill="#3b2a1a">
    <rect x="900" y="0" width="60" height="60"/><rect x="1020" y="0" width="60" height="60"/><rect x="1140" y="0" width="60" height="60"/>
    <rect x="960" y="60" width="60" height="60"/><rect x="1080" y="60" width="60" height="60"/>
    <rect x="1020" y="120" width="60" height="60"/><rect x="1140" y="120" width="60" height="60"/>
    <rect x="1080" y="180" width="60" height="60"/>
  </g>

  <!-- watch -->
  <g transform="translate(270 210)">
    <rect x="-58" y="-200" width="116" height="400" rx="26" fill="#2b2420"/>
    <circle r="142" fill="#1d1916"/>
    <circle r="132" fill="#4a3d33"/>
    <circle r="124" fill="#111"/>
    <g clip-path="url(#gbFaceClip)">
      <rect x="-120" y="-120" width="240" height="240" fill="url(#gbBoard)"/>
      <rect x="0" y="-60" width="30" height="30" fill="#cdd26a" opacity=".85"/>
      <rect x="30" y="30" width="30" height="30" fill="#aaa23a" opacity=".85"/>
      <g font-size="26" text-anchor="middle" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">
        <text x="-75" y="-81" fill="#111">♜</text><text x="15" y="-81" fill="#111">♚</text>
        <text x="-45" y="-51" fill="#111">♟</text><text x="75" y="-51" fill="#111">♟</text>
        <text x="15" y="-21" fill="#111">♞</text>
        <text x="-15" y="9" fill="#fff" stroke="#111" stroke-width=".6">♙</text>
        <text x="45" y="69" fill="#fff" stroke="#111" stroke-width=".6">
          ♕
          <animate attributeName="y" values="69;69;-51;-51;69" keyTimes="0;.3;.45;.85;1" dur="5s" repeatCount="indefinite"/>
          <animate attributeName="x" values="45;45;15;15;45" keyTimes="0;.3;.45;.85;1" dur="5s" repeatCount="indefinite"/>
        </text>
        <text x="-75" y="99" fill="#fff" stroke="#111" stroke-width=".6">♔</text>
      </g>
    </g>
    <circle r="124" fill="none" stroke="#e8c26a" stroke-width="5" stroke-dasharray="560 220" stroke-linecap="round" transform="rotate(-90)">
      <animate attributeName="stroke-dasharray" values="560 220;610 170;560 220" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- notification -->
  <g transform="translate(460 70)">
    <rect width="250" height="66" rx="18" fill="#fffaf0" stroke="#d9c7a3"/>
    <circle cx="33" cy="33" r="16" fill="#2b2420"/>
    <text x="33" y="40" text-anchor="middle" font-size="18" fill="#e8c26a" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif">♞</text>
    <text x="60" y="28" font-size="15" font-weight="700" fill="#2b2420" font-family="Helvetica,Arial,sans-serif">Your move</text>
    <text x="60" y="48" font-size="13" fill="#7a6650" font-family="Helvetica,Arial,sans-serif">opponent played Nf6 · 2 days left</text>
    <animateTransform attributeName="transform" type="translate" values="460 40;460 70;460 70;460 40" keyTimes="0;.12;.9;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.9;1" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- copy -->
  <g transform="translate(560 220)">
    <text font-size="76" fill="#2b2420" font-style="italic" letter-spacing="-1">Gambit</text>
    <text y="46" font-size="24" fill="#5c4a38">Lichess correspondence chess, on your wrist.</text>
    <text y="80" font-size="18" fill="#8a7357" font-family="Helvetica,Arial,sans-serif">Wear OS · move notifications · Stockfish reviews · no phone needed</text>
  </g>
</svg>
